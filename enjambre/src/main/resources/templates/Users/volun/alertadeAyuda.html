<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/Users/volun/layoutVol :: html}"
      th:with="titulo='Alertas de Ayuda - Voluntario'">
<head></head>
<body>
    <div th:fragment="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 class="rs-section-title">🚨 Alertas de Ayuda</h1>
        </div>
        
        <!-- Aquí se mostrarán las alertas dinámicamente -->
        <div id="listaAlertas">
            <!-- Las alertas se cargarán desde el backend -->
        </div>
        
        <!-- Mensaje cuando no hay alertas -->
        <div id="sinAlertas" class="rs-empty-state" style="display: none; text-align: center; padding: 60px;">
            <div class="rs-empty-icon">✅</div>
            <h3>No hay alertas pendientes</h3>
            <p>Las solicitudes de ayuda aparecerán aquí automáticamente.</p>
        </div>
    </div>
</body>
</html>
