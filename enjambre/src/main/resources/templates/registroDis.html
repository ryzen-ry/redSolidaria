<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: html"
      th:with="titulo='Registro Persona con Discapacidad | Red Solidaria UTP'">
<head></head>
<body>

<div th:fragment="content">
    <a th:href="@{/registro}" class="rs-back-link">← Volver a selección</a>

    <div class="rs-card">
        <div class="rs-card-header">
            <div class="rs-header-icon">
                <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
            </div>
            <h2>Registro de Persona con Discapacidad</h2>
            <p>Completa tu información personal</p>
        </div>

        <form th:action="@{/registro/discapacitado}" method="post">
            <div class="rs-form-grid">
                <div class="rs-field">
                    <label>Nombres <span class="req">*</span></label>
                    <input type="text" name="nombres" required />
                </div>
                <div class="rs-field">
                    <label>Apellidos <span class="req">*</span></label>
                    <input type="text" name="apellidos" required />
                </div>
                <div class="rs-field rs-form-full">
                    <label>Correo electrónico <span class="req">*</span></label>
                    <input type="email" name="email" required />
                </div>
                <div class="rs-field rs-form-full">
                    <label>Número RUI de Carnet CONADIS <span class="req">*</span></label>
                    <input type="text" name="conadis" placeholder="Ej: 00123456-2024" required />
                    <span class="rs-field-hint">Número del Registro Único de Identidad</span>
                </div>
                <div class="rs-field">
                    <label>Tipo de discapacidad <span class="req">*</span></label>
                    <select name="tipoDiscapacidad" required>
                        <option value="">Selecciona</option>
                        <option>Auditiva</option>
                        <option>Motriz</option>
                        <option>Visual</option>
                        <option>Del habla</option>
                    </select>
                </div>
                <div class="rs-field">
                    <label>Teléfono / Celular <span class="req">*</span></label>
                    <input type="tel" name="telefono" required />
                </div>
                <div class="rs-field rs-form-full">
                    <label>Dirección <span class="req">*</span></label>
                    <input type="text" name="direccion" placeholder="San Juan de Lurigancho" required />
                </div>
                <div class="rs-field">
                    <label>Contraseña <span class="req">*</span></label>
                    <input type="password" name="password" required />
                </div>
                <div class="rs-field">
                    <label>Confirmar Contraseña <span class="req">*</span></label>
                    <input type="password" name="confirmPassword" required />
                </div>
                <div class="rs-form-full">
                    <div class="rs-nota">
                        <strong>Nota:</strong> Tu cuenta será verificada por nuestro equipo antes de ser activada.
                    </div>
                </div>
                <div class="rs-form-full">
                    <button type="submit" class="rs-btn-submit">Registrarse</button>
                </div>

            </div>
        </form>

        <p class="rs-login-link">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
    </div>
</div>

</body>
</html>
